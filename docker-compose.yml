# Секреты и настройки почты берутся из файла .env рядом с этим файлом (шаблон — .env.example).
# Без .env всё работает с безопасными для локального запуска значениями по умолчанию.
services:
  db:
    image: postgres:15-alpine
    container_name: spp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Локальный «почтовый ящик»: все письма приложения видны в веб-интерфейсе http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: spp_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    container_name: spp_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://user:password@db:5432/appdb
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_please}
      JWT_ACCESS_TTL: 15m
      MAX_FAILED_ATTEMPTS: 5
      LOCK_MINUTES: 15
      MAX_SESSIONS: 5
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: spp_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
