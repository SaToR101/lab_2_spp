<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Менеджер записей</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Управление записями</h1>
            <div id="userBar" class="user-bar hidden">
                <span id="userInfo"></span>
                <button type="button" id="sessionsBtn" class="btn btn-secondary btn-small">Подключения</button>
                <button type="button" id="usersBtn" class="btn btn-secondary btn-small hidden">Пользователи</button>
                <button type="button" id="logoutBtn" class="btn btn-secondary btn-small">Выйти</button>
            </div>
        </header>

        <div id="alert" class="alert hidden" role="status" aria-live="polite"></div>

        <!-- ===== Экран авторизации ===== -->
        <section id="authView" class="hidden">
            <form id="loginForm" class="card form-card">
                <h2>Вход</h2>
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Пароль</label>
                    <input type="password" id="loginPassword" autocomplete="current-password" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Войти</button>
                    <button type="button" class="btn btn-secondary" data-show="registerForm">Регистрация</button>
                    <button type="button" class="btn btn-secondary" data-show="forgotForm">Забыли пароль?</button>
                </div>
            </form>

            <form id="registerForm" class="card form-card hidden">
                <h2>Регистрация</h2>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Пароль (минимум 8 символов, буквы и цифры)</label>
                    <input type="password" id="regPassword" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                    <button type="button" class="btn btn-secondary" data-show="loginForm">Назад ко входу</button>
                </div>
            </form>

            <form id="forgotForm" class="card form-card hidden">
                <h2>Восстановление доступа</h2>
                <p class="hint">Мы отправим ссылку для сброса пароля на вашу почту.</p>
                <div class="form-group">
                    <label for="forgotEmail">Email</label>
                    <input type="email" id="forgotEmail" autocomplete="email" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Отправить ссылку</button>
                    <button type="button" class="btn btn-secondary" data-show="loginForm">Назад ко входу</button>
                </div>
            </form>

            <form id="resetForm" class="card form-card hidden">
                <h2>Новый пароль</h2>
                <div class="form-group">
                    <label for="resetPassword">Новый пароль (минимум 8 символов, буквы и цифры)</label>
                    <input type="password" id="resetPassword" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Сохранить пароль</button>
                    <button type="button" class="btn btn-secondary" data-show="loginForm">Отмена</button>
                </div>
            </form>
        </section>

        <!-- ===== Основное приложение ===== -->
        <section id="appView" class="hidden">
            <form id="itemForm" class="card form-card">
                <h2 id="formTitle">Новая запись</h2>
                <input type="hidden" id="itemId">

                <div class="form-group">
                    <label for="title">Заголовок</label>
                    <input type="text" id="title" placeholder="Введите название..." maxlength="255" required>
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" rows="3" placeholder="Введите описание..." maxlength="5000" required></textarea>
                </div>

                <div class="form-group">
                    <label for="file">Прикрепить файл (jpg, png, gif, webp, pdf, txt, doc, docx; до 5 МБ)</label>
                    <input type="file" id="file" accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.txt,.doc,.docx">
                </div>

                <div id="currentFileContainer" class="form-group current-file-box hidden">
                    <div class="current-file-info">
                        <span class="file-icon">📁</span>
                        <span id="currentFileName"></span>
                    </div>
                    <label class="checkbox-label">
                        <input type="checkbox" id="removeFileCheckbox">
                        Удалить прикреплённый файл
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn" class="btn btn-primary">Сохранить</button>
                    <button type="button" id="cancelBtn" class="btn btn-secondary hidden">Отмена</button>
                </div>
            </form>

            <div class="section-header">
                <h2>Список записей</h2>
            </div>
            <div id="itemsContainer" class="items-grid"></div>
        </section>

        <!-- ===== Активные подключения ===== -->
        <section id="sessionsView" class="hidden">
            <div class="section-header">
                <h2>Активные подключения</h2>
                <button type="button" class="btn btn-secondary btn-small" id="backFromSessions">Назад</button>
            </div>
            <div id="sessionsContainer" class="items-grid"></div>
        </section>

        <!-- ===== Пользователи (только админ) ===== -->
        <section id="usersView" class="hidden">
            <div class="section-header">
                <h2>Пользователи и роли</h2>
                <button type="button" class="btn btn-secondary btn-small" id="backFromUsers">Назад</button>
            </div>
            <div id="usersContainer" class="items-grid"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
